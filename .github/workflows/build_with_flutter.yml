
### TIME:261111



name: Build With Flutter

on:
  push:
    branches: [ "main","master" ]
    ### Start build only on these branches
    paths-ignore:
      - '**.md'
      - '.github/workflows/*.yml'

  #pull_request:
  ### 在 PR 时触发，用于验证（如 Dependabot 的 PR）
    #branches: [ "main","master" ]
    ### Start build only on these branches

  workflow_dispatch: { }
  ### Support manual build in 'Actions/workflow'

env:
  FLUTTER_VERSION: '3.32.8'
  ### flutter-DART版本对应关系: https://blog.csdn.net/zhukui66/article/details/133300093

permissions:
  contents: read
  actions: write

jobs:
  build_apk:
    strategy:
      fail-fast: false
      ### debug失败不连带跳过release
      matrix:
        #abi_type: ['arm64-v8a', 'armeabi-v7a', 'x86_64']
        build_type: ['debug', 'release']

    name: Build ${{ matrix.build_type }} APK
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:

      - name: Cancel Previous Runs
        uses: styfle/cancel-workflow-action@0.13.1
        with:
          access_token: ${{ github.token }}

      - name: Checkout Code
        uses: actions/checkout@v7

      - name: Set Short SHA
        id: set_sha
        run: echo "short_sha=${GITHUB_SHA::7}" >> $GITHUB_OUTPUT

      - name: Set Up JDK
      ### JDK 要在 Flutter 之前
        uses: actions/setup-java@v6
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Set Up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: 'stable'
          cache: true

      - name: Cache Gradle Dependencies
        uses: actions/cache@v6
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: ${{ runner.os }}-gradle-${{ hashFiles('**/gradle-wrapper.properties', '**/pubspec.lock') }}
          restore-keys: |
            ${{ runner.os }}-gradle-

      #- name: Enable Android
      #  run: flutter config --enable-android

      - name: Install Dependencies
        run: flutter pub get
        ### 这里会读取pubspec.yaml文件

      #- name: Analyze Code
      #  run: flutter analyze

      - name: Tune Gradle Memory
        working-directory: android
        run: |
          if grep -q "^org.gradle.jvmargs=" gradle.properties; then
            ### 存在则替换原有配置
            sed -i 's/^org.gradle.jvmargs=.*/org.gradle.jvmargs=-Xmx4g -XX:MaxMetaspaceSize=1g/' gradle.properties
          else
            ### 不存在则在文件末尾安全新增（加换行避免拼接）
            printf "\norg.gradle.jvmargs=-Xmx4g -XX:MaxMetaspaceSize=1g\n" >> gradle.properties
          fi
          echo "=== gradle.properties ===" && cat gradle.properties

      - name: Build ${{ matrix.build_type }} APK
        run: flutter build apk --${{ matrix.build_type }}

      - name: Show APK Path
        run: |
          apk_dir="build/app/outputs/flutter-apk/"
          echo ">>${apk_dir}:"
          ls -la "${apk_dir}" || echo "(no APK outputs)"

      - name: Upload ${{ matrix.build_type }} APK
        uses: actions/upload-artifact@v7
        with:
          name: apk-${{ matrix.build_type }}-${{ steps.set_sha.outputs.short_sha }}
          path: build/app/outputs/flutter-apk/*.apk
          retention-days: 7
          ### 设置保存天数，节省github存储配额，默认90
          if-no-files-found: error
          ### 找不到APK文件直接报错
