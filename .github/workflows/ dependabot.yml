
version: 2

### 此文件用于自动更新工作流版本

updates:
  - package-ecosystem: "github-actions"
    directory: "/"
    ### 工作流文件通常位于仓库根目录的 .github/workflows 下
    schedule:
      interval: "weekly"
      ## # 每周检查更新
    groups:
      actions-dependencies:
        patterns:
          - "*"
          ### 将所有 Actions 依赖合并为一个 PR 更新
    commit-message:
      prefix: "ci"
      ### 提交消息前缀，标识为 CI 配置更新
    labels:
      - "dependencies"
      - "github-actions"
      ### 自定义标签便于分类
    open-pull-requests-limit: 5
    ### 限制同时打开的 PR 数量
    versioning-strategy: "increase"
    ### 直接升级到最新版本
    ignore:
      ### 如需忽略特定 Action 或版本，可在此添加规则
      ### - dependency-name: "actions/checkout"
      ###   versions: ["v5.x"]

      