### TIME:261111



name: Build With Flutter

on:
  push:
    branches: [ "main","master" ]
    ### Start build only on these branches
    paths-ignore:
      - '**.md'
      - '.github/workflows/*.yml'
  workflow_dispatch: { }
  ### Support manual build in 'Actions/workflow'

env:
  FLUTTER_VERSION: '3.32.8'

  # ANDROID_DIR: android
  ### Build from 'android' folder (when 'app' folder is in 'project/android' folder), modify it as you need.
  ### 只有当你想绕过 flutter build 直接调 gradle 时才需要

permissions:
  contents: read
  actions: write

jobs:
  build_apk:
    strategy:
      fail-fast: false
      ### debug失败不连带跳过release
      matrix:
        #abi_type: ['arm64-v8a', 'armeabi-v7a', 'x86_64']
        build_type: ['debug', 'release']
    ### 手动触发 → debug + release 都构建；push 到 main/master → 只构建 release
    if: ${{ github.event_name == 'workflow_dispatch' || matrix.build_type == 'release' }}
    name: Build ${{ matrix.build_type }} APK
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:

      - name: Cancel Previous Runs
        uses: styfle/cancel-workflow-action@0.13.1
        with:
          access_token: ${{ github.token }}

      - name: Checkout Code
        uses: actions/checkout@v7

      ### JDK 要在 Flutter 之前
      - name: Set Up JDK
        uses: actions/setup-java@v6
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Set Up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: 'stable'
          cache: true

      ### flutter-DART版本对应关系: https://blog.csdn.net/zhukui66/article/details/133300093

      ### Gradle 缓存（key 里带上 pubspec.lock，避免依赖变动后缓存陈旧）
      - name: Cache Gradle
        uses: actions/cache@v6
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: ${{ runner.os }}-gradle-${{ hashFiles('**/gradle-wrapper.properties', '**/build.gradle*', '**/settings.gradle*', '**/pubspec.yaml') }}
          restore-keys: |
            ${{ runner.os }}-gradle-

      #- name: Enable Android
      #  run: flutter config --enable-android

      - name: Install Dependencies
        run: flutter pub get
        ### 这里会读取pubspec.yaml文件

      - name: Analyze Code
        run: flutter analyze

      - name: Tune Gradle Memory
        working-directory: android
        run: |
          if grep -q "^org.gradle.jvmargs=" gradle.properties; then
            ### 存在则替换原有配置
            sed -i 's/^org.gradle.jvmargs=.*/org.gradle.jvmargs=-Xmx4g -XX:MaxMetaspaceSize=1g/' gradle.properties
          else
            ### 不存在则在文件末尾安全新增（加换行避免拼接）
            printf "\norg.gradle.jvmargs=-Xmx4g -XX:MaxMetaspaceSize=1g\n" >> gradle.properties
          fi
          echo "=== gradle.properties ===" && cat gradle.properties

      - name: Build ${{ matrix.build_type }} APK
        run: flutter build apk --${{ matrix.build_type }}

      - name: Show APK Path
        run: ls -la build/app/outputs/flutter-apk/

      - name: Upload ${{ matrix.build_type }} APK
        uses: actions/upload-artifact@v7
        with:
          name: apk-${{ matrix.build_type }}
          path: build/app/outputs/flutter-apk/*.apk
          retention-days: 7
          ### 设置保存天数，节省github存储配额，默认90 
