name: Build with flutter

### To build from subfolder,just modify the 'ANDROID_DIR'

on:
  push:
    branches: [ "main","master" ]
    ### Start build only on these branches
    paths-ignore:
      - '**.md'
      - '.github/workflows/*.yml'
  workflow_dispatch: { }
  ### Support manual build in 'Actions/workflow'

env:
  ANDROID_DIR: .
  ### Build from project root (when 'app' folder is just at project root)
  # ANDROID_DIR: android
  ### Build from 'android' folder (when 'app' folder is in 'project/android' folder), modify it as you need.

permissions:
  contents: write

jobs:
  build_apk:
    strategy:
      matrix:
        build_type: ['debug', 'release']
        # build_type: ['release']
    name: Build APK
    runs-on: ubuntu-latest
    steps:

      - name: Cancel previous runs
        uses: styfle/cancel-workflow-action@0.12.1
        with:
          access_token: ${{ github.token }}

      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Flutter
      ### 设置 Flutter 环境
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.32.8'
          channel: 'stable'
          cache: true

### flutter-DART版本对应关系: https://blog.csdn.net/zhukui66/article/details/133300093


#      ### 调试 - 彻底清理并初始化
#      - name: Reset project
#        ### 确保在项目根目录执行
#        working-directory: .
#        run: |
#          flutter clean
#          rm -rf .dart_tool pubspec.lock
#          echo ">>clean finished"

      - name: Configure Flutter SDK
      ### 自动生成 local.properties 并设置 flutter.sdk
        working-directory: ${{ env.ANDROID_DIR }}
        run: |
          echo "flutter.sdk=$FLUTTER_ROOT" > local.properties
          ### 将sdk路径写入文件
          cat local.properties
          ### 打印文件内容

      - name: Set up JDK
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Cache Gradle
        uses: actions/cache@v3
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: ${{ runner.os }}-gradle-${{ hashFiles('**/gradle-wrapper.properties', '**/build.gradle') }}

      - name: Increase Gradle memory
        working-directory: ${{ env.ANDROID_DIR }}
        run: |
          printf "\norg.gradle.jvmargs=-Xmx4g -XX:MaxMetaspaceSize=1g\n" >> gradle.properties

      - name: Make gradlew executable
        working-directory: ${{ env.ANDROID_DIR }}
        run: |
          if [ ! -f "gradlew" ]; then gradle wrapper; fi
          chmod +x gradlew

      - name: Set Gradle memory (support existing/missing config)
        run: |
          if grep -q "^org.gradle.jvmargs=" gradle.properties; then
            ### 存在则替换原有配置
            sed -i 's/^org.gradle.jvmargs=.*/org.gradle.jvmargs=-Xmx4g -XX:MaxMetaspaceSize=1g/' gradle.properties
          else
            ### 不存在则在文件末尾安全新增（加换行避免拼接）
            echo -e "\norg.gradle.jvmargs=-Xmx4g -XX:MaxMetaspaceSize=1g" >> gradle.properties
          fi
          ### 输出修改后的文件内容到日志
          echo "=== Modified gradle.properties content ==="
          cat gradle.properties

      - name: Setup Flutter plugins
        run: |
          ### 获取所有依赖项并生成'.dart_tool/package_config.json'文件
          flutter pub get || exit 1
          ### 添加Flutter官方提供的国际化语言支持库
          flutter pub add flutter_localizations --sdk=flutter || exit 1
          ### 升级所有依赖包到最新兼容版本
          flutter pub upgrade || exit 1

      - name: Prepare Flutter
        run: |
          ### 详细检查Flutter开发环境状态
          flutter doctor -v
          ### 显式启用Android平台支持，防止出现未知问题
          flutter config --enable-android
          ### 预下载Android平台所需的二进制文件和工具链，减少后续构建时间
          flutter precache --android

      - name: Build ${{ matrix.build_type }} APK
        working-directory: ${{ env.ANDROID_DIR }}
        run: |
          build_type=${{ matrix.build_type }}
          ./gradlew assemble${build_type^}

      - name: Show APK paths
        run: |
            echo ">>./build/app/outputs/flutter-apk:"
            ls -la ./build/app/outputs/flutter-apk

      - name: Upload ${{ matrix.build_type }} APK
        uses: actions/upload-artifact@v4
        with:
          name: apk-${{ matrix.build_type }}
          path: ./build/app/outputs/flutter-apk/*.apk

