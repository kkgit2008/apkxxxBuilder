### TIME:250915

name: Build With NDK

### To build from subfolder,just modify the 'ANDROID_DIR'

on:
  push:
    branches: [ "main","master" ]
    ### Start build only on these branches
    paths-ignore:
      - '**.md'
      - '.github/workflows/*.yml'
  workflow_dispatch: { }
  ### Support manual build in 'Actions/workflow'

env:
  ANDROID_DIR: .
  ### Build from project root (when 'app' folder is just at project root)
  # ANDROID_DIR: android
  ### Build from 'android' folder (when 'app' folder is in 'project/android' folder), modify it as you need.
  NDK_VERSION: 29.0.13599879
  CMAKE_VERSION: 3.30.5

permissions:
  contents: write

jobs:
  build_apk:
    strategy:
      matrix:
        build_type: ['debug', 'release']
        # build_type: ['debug']
    name: Build APK
    runs-on: ubuntu-latest
    steps:

      - name: Cancel Previous Runs
        uses: styfle/cancel-workflow-action@0.12.1
        with:
          access_token: ${{ github.token }}

      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set Short SHA
        id: set_sha
        run: echo "short_sha=${GITHUB_SHA::7}" >> $GITHUB_OUTPUT

      ### 缓存NDK安装目录
      - name: Cache NDK
        uses: actions/cache@v3
        id: cache-ndk
        with:
          path: /usr/local/lib/android/sdk/ndk/${{ env.NDK_VERSION }}
          key: ${{ runner.os }}-ndk-${{ env.NDK_VERSION }}


      ### 自动接受所有Android许可证（含Preview）并安装NDK（仅当缓存未命中时）
      - name: Accept Android licenses And Install NDK
        if: steps.cache-ndk.outputs.cache-hit != 'true'
        run: |
          ### 安装交互式应答工具expect
          sudo apt-get update && sudo apt-get install -y expect
          ### 修复语法错误+处理Preview许可证初始询问
          expect -c '
            set timeout 300
            spawn /usr/local/lib/android/sdk/cmdline-tools/latest/bin/sdkmanager --licenses
            ### 1. 先处理初始询问："Review licenses that have not been accepted (y/N)?"
            expect {
              "Review licenses that have not been accepted (y/N)?" {
                send "y\r"
                exp_continue
              }
            }
            ### 2. 再处理所有许可证的Accept确认
            while {[expect {
              "Accept? (y/N):" {
                send "y\r"
                exp_continue
              }
              ### 忽略进度条输出，避免干扰匹配
              -re "\[.*\] \d+%.*" {
                exp_continue
              }
              ### 监听流程结束
              eof {
                return 1
              }
            }]} {}
          '
          ### 直接安装所需NDK（所有许可证已接受）
          /usr/local/lib/android/sdk/cmdline-tools/latest/bin/sdkmanager "ndk;${{ env.NDK_VERSION }}"
        shell: bash


      - name: Set Up JDK
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Android SDK With Cmake
        uses: android-actions/setup-android@v3
        with:
          components: 'cmake;${{ env.CMAKE_VERSION }}'

      - name: Install Cmake
        uses: jwlawson/actions-setup-cmake@v2
        with:
          cmake-version: '${{ env.CMAKE_VERSION }}'

      - name: Cache Gradle And Build Outputs
        uses: actions/cache@v3
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
            ${{ env.ANDROID_DIR }}/app/build
            ${{ env.ANDROID_DIR }}/app/.cxx  ### NDK构建缓存目录
          key: ${{ runner.os }}-gradle-${{ hashFiles('**/gradle-wrapper.properties', '**/build.gradle', '**/CMakeLists.txt') }}
          restore-keys: |
            ${{ runner.os }}-gradle-

      - name: Increase Gradle Memory
        working-directory: ${{ env.ANDROID_DIR }}
        run: |
          printf "\norg.gradle.jvmargs=-Xmx4g -XX:MaxMetaspaceSize=1g\n" >> gradle.properties

      - name: Make Gradlew Executable
        working-directory: ${{ env.ANDROID_DIR }}
        run: |
          if [ ! -f "gradlew" ]; then gradle wrapper; fi
          chmod +x gradlew

      - name: Set Gradle Memory(support existing/missing config)
        run: |
          if grep -q "^org.gradle.jvmargs=" gradle.properties; then
            ### 存在则替换原有配置
            sed -i 's/^org.gradle.jvmargs=.*/org.gradle.jvmargs=-Xmx4g -XX:MaxMetaspaceSize=1g/' gradle.properties
          else
            ### 不存在则在文件末尾安全新增（加换行避免拼接）
            echo -e "\norg.gradle.jvmargs=-Xmx4g -XX:MaxMetaspaceSize=1g" >> gradle.properties
          fi
          ### 输出修改后的文件内容到日志
          echo "=== Modified gradle.properties content ==="
          cat gradle.properties

      - name: Build ${{ matrix.build_type }} APK
        working-directory: ${{ env.ANDROID_DIR }}
        run: |
          build_type=${{ matrix.build_type }}
          ./gradlew assemble${build_type^}

      - name: Show APK Path
        run: |
            echo ">>${{ env.ANDROID_DIR }}/app/build/outputs/apk/${{ matrix.build_type }}:"
            ls -la ${{ env.ANDROID_DIR }}/app/build/outputs/apk/${{ matrix.build_type }}

#      - name: Copy ${{ matrix.build_type }} APK
#        run: |
#          cp ${{ env.ANDROID_DIR }}/app/build/outputs/apk/${{ matrix.build_type }}/*.apk ./

      - name: Upload ${{ matrix.build_type }} APK
        uses: actions/upload-artifact@v4
        with:
          name: apk-${{ matrix.build_type }}-${{ steps.set_sha.outputs.short_sha }}
          path: ${{ env.ANDROID_DIR }}/app/build/outputs/apk/${{ matrix.build_type }}/*.apk

