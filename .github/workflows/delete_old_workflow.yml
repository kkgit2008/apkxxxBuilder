### TIME:260911



name: Delete Old Workflow Runs

on:
  workflow_dispatch:
    inputs:
      days:
        description: 'The min days to keep'
        required: true
        default: "1"
      minimum_runs:
        description: 'The min runs to keep for each workflow'
        required: true
        default: "1"

run-name: Delete runs older than ${{ github.event.inputs.days }} days (keep min ${{ github.event.inputs.minimum_runs }})

permissions:
  actions: write
  contents: read

jobs:
  del_runs:
    runs-on: ubuntu-latest
    steps:
      - name: Validate Inputs
        run: |
          if ! [[ "${{ github.event.inputs.days }}" =~ ^[0-9]+$ ]]; then
            echo "days must be a non-negative integer"
            exit 1
          fi
          if ! [[ "${{ github.event.inputs.minimum_runs }}" =~ ^[0-9]+$ ]]; then
            echo "minimum_runs must be a non-negative integer"
            exit 1
          fi

      - name: Delete Workflow Runs
        uses: Mattraks/delete-workflow-runs@v2
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          repository: ${{ github.repository }}
          retain_days: ${{ github.event.inputs.days }}
          keep_minimum_runs: ${{ github.event.inputs.minimum_runs }}